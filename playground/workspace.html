        <!-- Nhúng Tailwind CSS để hiển thị chính xác các class của Header WynAlgo -->
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0c0d10;
                overflow: hidden;
            }
            /* Đẩy khung biểu đồ xuống phía dưới Header (chiều cao Header khoảng 76px) */
            #workspace {
                position: absolute;
                top: 76px;
                left: 0;
                right: 0;
                bottom: 0;
            }
            .btn-getaccess {
            background: linear-gradient(135deg, #10b981, #8a2be2);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .btn-getaccess::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s;
        }


        .btn-getaccess:hover::before {
            left: 100%;
        }
        </style>
    </head>
